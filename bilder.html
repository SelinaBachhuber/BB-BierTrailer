  <script>
    //Dropdown Menü
    function toggleDropdown() {
      document.getElementById("myDropdown").classList.toggle("show");
    }

    // Klick außerhalb schließt das Menü
    window.onclick = function (event) {
      if (!event.target.matches('.dropbtn')) {
        let dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          let openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
    //////////////

    //Bildgallerie
 const gallery = document.getElementById("gallery");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentIndex = 0;

// Anzahl der Bilder, die wir duplizieren (mindestens so viele wie sichtbar)
const cloneCount = 3;

// Ursprüngliche Anzahl speichern
const originalCount = gallery.children.length;

// --- 1. Bilder duplizieren ---
for (let i = 0; i < cloneCount; i++) {
    const clone = gallery.children[i].cloneNode(true);
    gallery.appendChild(clone);
}

// --- 2. Responsive Anzahl der sichtbaren Bilder ---
function getImagesPerView() {
    if (window.innerWidth <= 600) return 1;
    if (window.innerWidth <= 900) return 2;
    return 3;
}

// --- 3. Galerie aktualisieren ---
function updateGallery(animate = true) {
    const imageWidth = gallery.children[0].offsetWidth + 10;

    if (animate) {
        gallery.style.transition = "transform 0.4s ease";
    } else {
        gallery.style.transition = "none";
    }

    gallery.style.transform = `translateX(-${currentIndex * imageWidth}px)`;
}

// --- 4. Weiter-Button (rechts) ---
nextBtn.addEventListener("click", () => {
    currentIndex++;
    updateGallery(true);

    const imagesPerView = getImagesPerView();
    const totalImages = gallery.children.length;

    // Wenn wir in die duplizierten Bilder fahren
    setTimeout(() => {
        if (currentIndex >= originalCount) {
            currentIndex = 0;
            updateGallery(false); // ohne Animation zurücksetzen
        }
    }, 400);
});

// --- 5. Zurück-Button (links) ---
prevBtn.addEventListener("click", () => {
    const imagesPerView = getImagesPerView();

    // Wenn wir am Anfang sind und nach links wollen
    if (currentIndex === 0) {
        currentIndex = originalCount;
        updateGallery(false); // ohne Animation ans Ende springen
    }

    currentIndex--;
    updateGallery(true);
});

// --- 6. Bei Fenstergröße neu berechnen ---
window.addEventListener("resize", () => {
    updateGallery(false);
});

// --- 7. Initial starten ---
updateGallery(false);


  </script>
